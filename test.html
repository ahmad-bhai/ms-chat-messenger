<!DOCTYPE html>
<html lang="en" data-t="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MS Chat - API Client</title>
  <style>
    :root{--bg:#14101c;--bb:rgba(38,32,52,.82);--bd:rgba(255,255,255,.14);--tx:#fff;--sf:#D0BDF4;--ac:linear-gradient(135deg,#E120E4,#C54FDA 50%,#9B0BE1);--me:#7a2bc4;--fs:16px}
    [data-t=light]{--bg:#f3ecfb;--bb:rgba(255,255,255,.9);--bd:rgba(0,0,0,.1);--tx:#1d1530;--sf:#6a4fa0;--me:#e3c9fb}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font:15px Poppins,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--tx);height:100dvh;overflow:hidden}
    [hidden]{display:none!important}
    .scr{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);z-index:5}
    .badge{background:var(--bb);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:22px}
    .hd{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px}
    .ttl{font-size:18px;font-weight:700}
    .inp{width:100%;background:var(--bb);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;color:inherit;font:inherit;outline:0;margin:8px 0}
    .btn{width:100%;border:0;border-radius:99px;padding:14px;color:#fff;background:var(--ac);font-weight:700;font-size:16px;font-family:inherit;cursor:pointer;margin-top:12px}
    .au{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;max-width:400px;margin:0 auto;width:100%;text-align:center}
    .au h1{font-size:28px;font-weight:800;margin:10px 0 16px}
    .hint{opacity:.75;font-size:13px;margin-bottom:14px}
    #ts{position:fixed;left:0;right:0;bottom:30px;z-index:11;display:flex;justify-content:center;pointer-events:none}
    .tt{background:#000d;color:#fff;border-radius:99px;padding:10px 18px;font-size:14px}
    .row{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);cursor:pointer}
    .row:active{background:var(--bd)}
    .fx{flex:1;min-width:0;text-align:left}
    .sn{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .av{width:46px;height:46px;border-radius:50%;background:#7a2bc4;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none}
    
    /* Chat & Messages styling */
    #messages-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 16px; font-size: 14px; word-break: break-word; }
    .msg.me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 4px; }
    .msg.th { align-self: flex-start; background: var(--bb); border-bottom-left-radius: 4px; border: 1px solid var(--bd); }
    .msg-time { font-size: 10px; opacity: 0.6; text-align: right; margin-top: 2px; }
    .chat-cmp { display: flex; gap: 8px; align-items: flex-end; padding: 10px; background: var(--bb); border-top: 1px solid var(--bd); }
    .chat-cmp textarea { flex: 1; max-height: 100px; resize: none; border-radius: 20px; padding: 10px 14px; background: var(--bg); border: 1px solid var(--bd); color: inherit; font: inherit; outline: 0; }
    .ib { background: none; border: 0; color: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 12px; }
  </style>
</head>
<body>

<div class="scr" id="app">
  <div id="view" style="flex:1;display:flex;flex-direction:column;overflow:hidden"></div>
</div>

<div id="ts"></div>

<script>
  const API_KEY = 'ms_dev_9f8fcf0e2e34cc97c959637af4b1cf85';
  const BASE_URL = 'https://ms-chat-messenger.vercel.app/api/ms-api/' + API_KEY;
  
  const $ = s => document.querySelector(s);
  const toast = t => {
    $('#ts').innerHTML = `<div class="tt">${t}</div>`;
    clearTimeout(window._tt);
    window._tt = setTimeout(() => $('#ts').innerHTML = '', 2600);
  };

  let state = { email: '', pend: '', chats: [], currentChat: null, myId: null };

  async function api(path, data) {
    const token = localStorage.getItem('ms_dev_token');
    try {
      const res = await fetch(BASE_URL + path, {
        method: data ? 'POST' : 'GET',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: data ? JSON.stringify(data) : undefined
      });
      return await res.json();
    } catch (e) {
      return { err: 'Network error' };
    }
  }

  // --- Login Screens ---
  function renderLogin() {
    $('#view').innerHTML = `
      <div class="au">
        <h1>MS Chat API</h1>
        <p class="hint">Enter your email to sign in via Developer API</p>
        <input type="email" id="email-inp" class="inp" placeholder="you@example.com" autocomplete="email">
        <button class="btn" id="btn-next">Continue</button>
      </div>
    `;
    $('#btn-next').onclick = async () => {
      const email = $('#email-inp').value.trim();
      if (!email) return toast('Please enter email');
      const res = await api('/login-start', { email });
      if (res.err) return toast(res.err);
      state.email = email;
      toast('Code sent successfully!');
      renderOTP();
    };
  }

  function renderOTP() {
    $('#view').innerHTML = `
      <div class="au">
        <h1>Enter Code</h1>
        <p class="hint">Enter 6-digit code sent to <b>${state.email}</b></p>
        <input type="tel" id="code-inp" class="inp" placeholder="123456" maxlength="6" style="text-align:center;letter-spacing:4px;font-size:20px">
        <button class="btn" id="btn-verify">Verify Code</button>
      </div>
    `;
    $('#btn-verify').onclick = async () => {
      const code = $('#code-inp').value.trim();
      if (!code) return toast('Please enter code');
      const res = await api('/login-verify', { email: state.email, code });
      if (res.err) return toast(res.err);
      if (res.need2fa) { state.pend = res.pend; render2FA(); }
      else if (res.token) { localStorage.setItem('ms_dev_token', res.token); initDashboard(); }
    };
  }

  function render2FA() {
    $('#view').innerHTML = `
      <div class="au">
        <h1>Two-Step Password</h1>
        <input type="password" id="two-inp" class="inp" placeholder="Password">
        <button class="btn" id="btn-2fa">Login</button>
      </div>
    `;
    $('#btn-2fa').onclick = async () => {
      const two = $('#two-inp').value;
      if (!two) return toast('Enter password');
      const res = await api('/login-2fa', { pend: state.pend, two });
      if (res.err) return toast(res.err);
      if (res.token) { localStorage.setItem('ms_dev_token', res.token); initDashboard(); }
    };
  }

  // --- Dashboard & Chat List ---
  async function initDashboard() {
    const meRes = await api('/me');
    if (!meRes.me) return logout();
    state.myId = meRes.me.id;
    loadDashboard();
  }

  async function loadDashboard() {
    $('#view').innerHTML = `
      <div class="hd badge" style="border-radius:0">
        <b class="ttl fx">Chats</b>
        <button class="ib" onclick="logout()" title="Logout">🚪</button>
      </div>
      <div id="chats-list" style="overflow-y:auto;flex:1">
        <p style="text-align:center;opacity:0.6;padding:30px">Loading chats...</p>
      </div>
    `;

    const data = await api('/chats');
    if (data.err) return logout();
    state.chats = data.chats || [];

    if (state.chats.length === 0) {
      $('#chats-list').innerHTML = '<p style="text-align:center;opacity:0.6;padding:30px">No chats found.</p>';
      return;
    }

    $('#chats-list').innerHTML = state.chats.map((c, i) => `
      <div class="row" onclick="openChat(${i})">
        <div class="av">${c.peer.name.charAt(0).toUpperCase()}</div>
        <div class="fx">
          <b>${c.peer.name}</b>
          <div class="sn">${c.last ? c.last.text : 'No messages yet'}</div>
        </div>
      </div>
    `).join('');
  }

  // --- Chat View & Messaging ---
  async function openChat(index) {
    const c = state.chats[index];
    state.currentChat = c;

    $('#view').innerHTML = `
      <div class="hd badge" style="border-radius:0">
        <button class="ib" onclick="loadDashboard()">⬅</button>
        <b class="ttl fx">${c.peer.name}</b>
      </div>
      <div id="messages-list"><p style="text-align:center;opacity:0.6;margin-top:20px;">Loading messages...</p></div>
      <div class="chat-cmp">
        <textarea id="msg-input" rows="1" placeholder="Type a message..."></textarea>
        <button class="btn" id="btn-send" style="width:auto;margin:0;padding:10px 16px;border-radius:16px;">Send</button>
      </div>
    `;

    $('#btn-send').onclick = sendMessage;
    $('#msg-input').onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };

    await fetchMessages();
  }

  async function fetchMessages() {
    if (!state.currentChat) return;
    const res = await api('/msgs?chat=' + encodeURIComponent(state.currentChat.chat));
    if (!res.msgs) return;

    const listEl = $('#messages-list');
    listEl.innerHTML = res.msgs.map(m => {
      const isMe = m.from === state.myId;
      return `
        <div class="msg ${isMe ? 'me' : 'th'}">
          <div>${escapeHTML(m.text || '')}</div>
          <div class="msg-time">${new Date(m.ts).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
        </div>
      `;
    }).join('') || '<p style="text-align:center;opacity:0.5">No messages yet</p>';

    listEl.scrollTop = listEl.scrollHeight;
  }

  async function sendMessage() {
    const input = $('#msg-input');
    const text = input.value.trim();
    if (!text || !state.currentChat) return;

    input.value = '';
    const res = await api('/send', { chat: state.currentChat.chat, text });
    if (res.err) {
      toast(res.err);
      return;
    }
    await fetchMessages();
  }

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
  }

  window.logout = () => {
    localStorage.removeItem('ms_dev_token');
    renderLogin();
  };

  window.onload = () => {
    if (localStorage.getItem('ms_dev_token')) {
      initDashboard();
    } else {
      renderLogin();
    }
  };
</script>
</body>
</html>
