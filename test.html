<!DOCTYPE html>
<html lang="en" data-t="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MS Chat - Official API Client</title>
  <style>
    :root{--bg:#14101c;--bb:rgba(38,32,52,.82);--bd:rgba(255,255,255,.14);--tx:#fff;--sf:#D0BDF4;--ac:linear-gradient(135deg,#E120E4,#C54FDA 50%,#9B0BE1);--me:#7a2bc4;--fs:16px}
    [data-t=light]{--bg:#f3ecfb;--bb:rgba(255,255,255,.9);--bd:rgba(0,0,0,.1);--tx:#1d1530;--sf:#6a4fa0;--me:#e3c9fb}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font:15px Poppins,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--tx);height:100dvh;overflow:hidden}
    [hidden]{display:none!important}
    .scr{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(circle at 12% 8%,rgba(225,32,228,.28),transparent 42%),radial-gradient(circle at 92% 28%,rgba(90,70,255,.28),transparent 45%),var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);z-index:5}
    .badge{background:var(--bb);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:26px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 10px 26px rgba(0,0,0,.22)}
    .hd{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px;border-radius:0 0 28px 28px}
    .ttl{font-size:18px;font-weight:700}
    .inp{width:100%;background:var(--bb);border:1px solid var(--bd);border-radius:24px;padding:14px 18px;color:inherit;font:inherit;outline:0;margin:8px 0}
    .btn{width:100%;border:0;border-radius:99px;padding:14px;color:#fff;background:var(--ac);font-weight:700;font-size:16px;font-family:inherit;cursor:pointer;margin-top:12px;box-shadow:0 10px 24px rgba(155,11,225,.45)}
    .au{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;max-width:400px;margin:0 auto;width:100%;text-align:center}
    .au h1{font-size:30px;font-weight:800;margin:10px 0 16px;background:var(--ac);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .hint{opacity:.75;font-size:13px;margin-bottom:16px}
    #ts{position:fixed;left:0;right:0;bottom:30px;z-index:11;display:flex;justify-content:center;pointer-events:none}
    .tt{background:#000d;color:#fff;border-radius:99px;padding:10px 20px;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
    
    /* Rows & Avatars */
    .row{display:flex;gap:14px;align-items:center;padding:12px 18px;margin:4px 10px;cursor:pointer;border-radius:22px;transition:0.2s}
    .row:active{background:var(--bd);transform:scale(0.98)}
    .fx{flex:1;min-width:0;text-align:left}
    .sn{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;margin-top:2px}
    .r1{display:flex;justify-content:space-between;align-items:center}
    .av{width:50px;height:50px;border-radius:50%;object-fit:cover;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.5),transparent 38%),#7a2bc4;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none;box-shadow:0 6px 14px rgba(0,0,0,.3)}
    
    /* Custom Emoji Style */
    .chat-emoji { width: 20px; height: 20px; vertical-align: -3px; display: inline-block; object-fit: contain; margin: 0 1px; }

    /* Chat & Messages */
    #messages-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 20px; font-size: 15px; word-break: break-word; border: 1px solid var(--bd); box-shadow: 0 4px 12px rgba(0,0,0,.18); }
    .msg.me { align-self: flex-end; background: linear-gradient(135deg,#a02ee8,#6a2bd9); color: #fff; border-bottom-right-radius: 6px; }
    .msg.th { align-self: flex-start; background: var(--bb); border-bottom-left-radius: 6px; }
    .msg-time { font-size: 10px; opacity: 0.6; text-align: right; margin-top: 3px; }
    
    /* Media Elements inside Message */
    .md-img { max-width: 100%; max-height: 260px; border-radius: 14px; display: block; margin-bottom: 4px; object-fit: cover; cursor: pointer; }
    .md-vid { max-width: 100%; max-height: 260px; border-radius: 14px; display: block; margin-bottom: 4px; }
    .md-audio { width: 100%; margin: 4px 0; }
    
    /* Composition Bar */
    .chat-cmp { display: flex; gap: 8px; align-items: flex-end; padding: 12px; background: var(--bb); border-top: 1px solid var(--bd); backdrop-filter: blur(18px); }
    .chat-cmp textarea { flex: 1; max-height: 120px; resize: none; border-radius: 24px; padding: 12px 16px; background: var(--bg); border: 1px solid var(--bd); color: inherit; font: inherit; outline: 0; }
    .ib { background: none; border: 0; color: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 14px; transition: 0.2s; }
    .ib:active { transform: scale(0.9); }
    .send-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--ac); border: 0; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; box-shadow: 0 6px 16px rgba(155,11,225,.45); }
  </style>
</head>
<body>

<div class="scr" id="app">
  <div id="view" style="flex:1;display:flex;flex-direction:column;overflow:hidden"></div>
</div>

<div id="ts"></div>

<script>
  // Yahan apni active API key daalein
  const API_KEY = 'ms_dev6e24ab34fc346f8f2835319df7a9607a';
  const BASE_URL = 'https://ms-chat-messenger.vercel.app/api/ms-api/' + API_KEY;
  
  const $ = s => document.querySelector(s);
  const toast = t => {
    $('#ts').innerHTML = `<div class="tt">${t}</div>`;
    clearTimeout(window._tt);
    window._tt = setTimeout(() => $('#ts').innerHTML = '', 2600);
  };

  let state = { email: '', pend: '', chats: [], currentChat: null, me: null };

  // Secure API Call wrapper with 401 handling
  async function api(path, data) {
    const token = localStorage.getItem('ms_dev_token');
    try {
      const res = await fetch(BASE_URL + path, {
        method: data ? 'POST' : 'GET',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: data ? JSON.stringify(data) : undefined
      });

      if (res.status === 401) {
        localStorage.removeItem('ms_dev_token');
        toast('Session expired or key revoked.');
        renderLogin();
        return { err: 'Unauthorized' };
      }

      return await res.json();
    } catch (e) {
      return { err: 'Network error' };
    }
  }

  // --- Emoji Regex & Parser for Telegram-like Custom Emoji Render ---
  const EMOJI_REGEX = /(\p{Extended_Pictographic}|\p{Emoji_Component}|\u200d)+/gu;

  function parseEmojis(str) {
    if (!str) return '';
    const safeStr = escapeHTML(str);
    return safeStr.replace(EMOJI_REGEX, (match) => {
      // Endpoint ke mutabiq emoji name ko encode karke image URL banayenge[span_2](start_span)[span_2](end_span)
      const emojiUrl = `${BASE_URL}/emoji?name=${encodeURIComponent(match)}`;
      return `<img class="chat-emoji" src="${emojiUrl}" alt="${match}" onerror="this.outerHTML='${match}'">`;
    });
  }

  // --- Helper to render avatars properly ---
  function renderAvatar(u, size = 50) {
    if (u && u.avatar) {
      return `<img class="av" style="width:${size}px;height:${size}px" src="${u.avatar}">`;
    }
    const initial = u && u.name ? u.name.charAt(0).toUpperCase() : '?';
    return `<div class="av" style="width:${size}px;height:${size}px">${initial}</div>`;
  }

  // --- Login Screens ---
  function renderLogin() {
    $('#view').innerHTML = `
      <div class="au">
        <h1>MS Chat</h1>
        <p class="hint">Sign in with your developer API account</p>
        <input type="email" id="email-inp" class="inp" placeholder="you@example.com" autocomplete="email">
        <button class="btn" id="btn-next">Continue</button>
      </div>
    `;
    $('#btn-next').onclick = async () => {
      const email = $('#email-inp').value.trim();
      if (!email) return toast('Please enter email');
      const res = await api('/login-start', { email });
      if (res.err) return toast(res.err);
      state.email = email;
      toast('Verification code sent!');
      renderOTP();
    };
  }

  function renderOTP() {
    $('#view').innerHTML = `
      <div class="au">
        <h1>Enter Code</h1>
        <p class="hint">6-digit code sent to <b>${state.email}</b></p>
        <input type="tel" id="code-inp" class="inp" placeholder="123456" maxlength="6" style="text-align:center;letter-spacing:6px;font-size:22px">
        <button class="btn" id="btn-verify">Verify Code</button>
      </div>
    `;
    $('#btn-verify').onclick = async () => {
      const code = $('#code-inp').value.trim();
      if (!code) return toast('Please enter code');
      const res = await api('/login-verify', { email: state.email, code });
      if (res.err) return toast(res.err);
      if (res.need2fa) { state.pend = res.pend; render2FA(); }
      else if (res.token) { localStorage.setItem('ms_dev_token', res.token); initDashboard(); }
    };
  }

  function render2FA() {
    $('#view').innerHTML = `
      <div class="au">
        <h1>Security</h1>
        <p class="hint">Enter your two-step verification password</p>
        <input type="password" id="two-inp" class="inp" placeholder="Password">
        <button class="btn" id="btn-2fa">Login</button>
      </div>
    `;
    $('#btn-2fa').onclick = async () => {
      const two = $('#two-inp').value;
      if (!two) return toast('Enter password');
      const res = await api('/login-2fa', { pend: state.pend, two });
      if (res.err) return toast(res.err);
      if (res.token) { localStorage.setItem('ms_dev_token', res.token); initDashboard(); }
    };
  }

  // --- Dashboard & Chat List ---
  async function initDashboard() {
    const meRes = await api('/me');
    if (!meRes.me) return renderLogin();
    state.me = meRes.me;
    loadDashboard();
  }

  async function loadDashboard() {
    $('#view').innerHTML = `
      <div class="hd badge">
        ${renderAvatar(state.me, 36)}
        <b class="ttl fx">${parseEmojis(state.me.name)}</b>
        <button class="ib" onclick="logout()" title="Logout">⚙️</button>
      </div>
      <div id="chats-list" style="overflow-y:auto;flex:1;padding:6px 0">
        <p style="text-align:center;opacity:0.6;padding:40px">Loading chats...</p>
      </div>
    `;

    const data = await api('/chats');
    if (data.err) return;
    state.chats = data.chats || [];

    if (state.chats.length === 0) {
      $('#chats-list').innerHTML = '<p style="text-align:center;opacity:0.6;padding:40px">No chats found.</p>';
      return;
    }

    $('#chats-list').innerHTML = state.chats.map((c, i) => `
      <div class="row badge" onclick="openChat(${i})">
        ${renderAvatar(c.peer, 50)}
        <div class="fx">
          <div class="r1">
            <b>${parseEmojis(c.peer.name)}</b>
            <small style="opacity:0.6">${c.last ? new Date(c.last.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : ''}</small>
          </div>
          <div class="sn">${c.last ? (c.last.media ? '['+c.last.media.type+'] ' : '') + parseEmojis(c.last.text) : 'No messages yet'}</div>
        </div>
      </div>
    `).join('');
  }

  // --- Chat View & Media Renderer ---
  async function openChat(index) {
    const c = state.chats[index];
    state.currentChat = c;

    $('#view').innerHTML = `
      <div class="hd badge">
        <button class="ib" onclick="loadDashboard()">←</button>
        ${renderAvatar(c.peer, 36)}
        <b class="ttl fx">${parseEmojis(c.peer.name)}</b>
      </div>
      <div id="messages-list"><p style="text-align:center;opacity:0.6;margin-top:30px;">Loading messages...</p></div>
      <div class="chat-cmp">
        <textarea id="msg-input" rows="1" placeholder="Type a message..."></textarea>
        <button class="send-btn" id="btn-send">➤</button>
      </div>
    `;

    $('#btn-send').onclick = sendMessage;
    $('#msg-input').onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };

    await fetchMessages();
  }

  // Render media (Images, Videos, Audio, Voices) inside message
  function renderMedia(media) {
    if (!media || !media.url) return '';
    const u = media.url;
    if (media.type === 'image') {
      return `<img class="md-img" src="${u}" onclick="window.open('${u}', '_blank')" alt="photo">`;
    }
    if (media.type === 'video') {
      return `<video class="md-vid" controls preload="metadata" src="${u}"></video>`;
    }
    if (media.type === 'audio' || media.type === 'voice') {
      return `<audio class="md-audio" controls src="${u}"></audio>`;
    }
    return `<a href="${u}" target="_blank" style="color:var(--sf);display:block;margin:4px 0">📎 Download File</a>`;
  }

  async function fetchMessages() {
    if (!state.currentChat) return;
    const res = await api('/msgs?chat=' + encodeURIComponent(state.currentChat.chat));
    if (!res.msgs) return;

    const listEl = $('#messages-list');
    listEl.innerHTML = res.msgs.map(m => {
      const isMe = m.from === state.me.id;
      return `
        <div class="msg ${isMe ? 'me' : 'th'}">
          ${renderMedia(m.media)}
          ${m.text ? `<div>${parseEmojis(m.text)}</div>` : ''}
          <div class="msg-time">${new Date(m.ts).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
        </div>
      `;
    }).join('') || '<p style="text-align:center;opacity:0.5;margin-top:20px">No messages yet</p>';

    listEl.scrollTop = listEl.scrollHeight;
  }

  async function sendMessage() {
    const input = $('#msg-input');
    const text = input.value.trim();
    if (!text || !state.currentChat) return;

    input.value = '';
    const res = await api('/send', { chat: state.currentChat.chat, text });
    if (res.err) {
      toast(res.err);
      return;
    }
    await fetchMessages();
  }

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
  }

  window.logout = () => {
    localStorage.removeItem('ms_dev_token');
    renderLogin();
  };

  window.onload = () => {
    if (localStorage.getItem('ms_dev_token')) {
      initDashboard();
    } else {
      renderLogin();
    }
  };
</script>
</body>
</html>
