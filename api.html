<!DOCTYPE html>
<html lang="en" data-t="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MS Chat - Developer API</title>
  <link rel="stylesheet" href="https://ms-chat-messenger.vercel.app/style.css">
  <style>
    /* Page specific tweaks */
    .dev-card { padding: 16px; margin-bottom: 12px; }
    .key-val { font-family: monospace; background: var(--bd); padding: 4px 8px; border-radius: 8px; font-size: 13px; word-break: break-all; display: block; margin: 8px 0; }
    .code-box { background: #0f0b15; border: 1px solid var(--bd); border-radius: 12px; padding: 12px; overflow-x: auto; font-family: monospace; font-size: 13px; margin-top: 10px; }
    .code-box code { background: none; padding: 0; color: #a78bfa; }
    .tabs { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; scrollbar-width: none; }
    .tabs button { background: var(--bb); border: 1px solid var(--bd); color: var(--tx); padding: 6px 12px; border-radius: 99px; font-size: 13px; cursor: pointer; flex: none; }
    .tabs button.on { background: var(--ac); border-color: transparent; font-weight: bold; }
    .copy-btn { background: none; border: 1px solid var(--bd); padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .copy-btn:active { transform: scale(0.95); }
    .copy-btn .i { width: 14px; height: 14px; }
  </style>
</head>
<body>

<div class="scr" id="app">
  <!-- Header -->
  <div class="hd badge">
    <a href="/" class="ib" style="text-decoration:none;color:inherit">
      <svg class="i" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </a>
    <b class="ttl fx">Developer API</b>
  </div>

  <!-- Main Content -->
  <div style="padding: 16px; overflow-y: auto; flex: 1;" id="content">
    
    <!-- Step 1: Email Verification -->
    <div id="step-email" class="badge dev-card">
      <h3>Step 1: Verify Email</h3>
      <p style="font-size: 13px; opacity: 0.8; margin-bottom: 12px;">Apna MS Chat account ka email daalein.</p>
      <input type="email" id="email" class="inp" placeholder="you@example.com">
      <button class="btn" id="btn-send-otp">Send OTP</button>
    </div>

    <!-- Step 2: OTP Input -->
    <div id="step-otp" class="badge dev-card" hidden>
      <h3>Step 2: Enter OTP</h3>
      <p style="font-size: 13px; opacity: 0.8; margin-bottom: 12px;">Email par aaya hua 6-digit code daalein.</p>
      <input type="tel" id="otp" class="inp" placeholder="123456" maxlength="6">
      <button class="btn" id="btn-verify-otp">Verify & Login</button>
    </div>

    <!-- Step 3: API Dashboard -->
    <div id="step-dashboard" hidden>
      <div class="badge dev-card" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <b>Active Keys</b>
          <p style="font-size: 12px; opacity: 0.7;">Max 3 keys allowed</p>
        </div>
        <button class="btn" id="btn-gen" style="width: auto; padding: 8px 16px; margin: 0;">+ Generate New</button>
      </div>
      
      <div id="keys-list"></div>

      <!-- Docs Section -->
      <div class="badge dev-card" style="margin-top: 24px;">
        <h3>API Documentation</h3>
        <p style="font-size: 13px; opacity: 0.8; margin-bottom: 12px;">
          Is key ko use karke aap apni website se API access kar sakte hain. Base URL:<br>
          <code id="base-url" style="margin-top: 6px; display: inline-block;"></code>
        </p>
        
        <div class="tabs" id="code-tabs">
          <button class="on" data-lang="node">Node.js</button>
          <button data-lang="js">JavaScript</button>
          <button data-lang="python">Python</button>
          <button data-lang="php">PHP</button>
          <button data-lang="curl">cURL</button>
        </div>
        <div class="code-box" id="code-display">Select a key above to see code.</div>
      </div>
    </div>

  </div>
</div>

<div id="ts"></div>

<script>
  const $ = s => document.querySelector(s);
  const EMAILJS_API = 'https://api.emailjs.com/api/v1.0/email/send';
  let currentEmail = '';
  let currentKey = '';

  // Toast helper
  const toast = (msg) => {
    const t = $('#ts');
    t.innerHTML = `<div class="tt">${msg}</div>`;
    clearTimeout(window._tt);
    window._tt = setTimeout(() => t.innerHTML = '', 2500);
  };

  // Copy helper (no alert)
  const copyToClipboard = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
      toast('Copied to clipboard!');
    } catch (e) {
      toast('Failed to copy');
    }
  };

  // API Call helper for internal Admin
  async function apiAdmin(endpoint, body = null) {
    const secret = prompt("Enter AUTH_SECRET for Admin Access:"); // Simple protection
    if (!secret) throw new Error("Secret required");
    
    const opt = {
      method: body ? 'POST' : 'GET',
      headers: { 'Content-Type': 'application/json', 'x-auth-secret': secret }
    };
    if (body) opt.body = JSON.stringify(body);
    
    const res = await fetch('/api' + endpoint, opt);
    return await res.json();
  }

  // --- Step 1: Send OTP ---
  $('#btn-send-otp').onclick = async () => {
    const email = $('#email').value.trim();
    if (!email) return toast('Email likhein');
    
    const btn = $('#btn-send-otp');
    btn.textContent = 'Sending...';
    btn.disabled = true;

    try {
      // MS Chat ke login-start endpoint ko call karke OTP mangwaya
      const res = await fetch('/api/auth/login-start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      
      if (data.err) throw new Error(data.err);
      
      currentEmail = email;
      $('#step-email').hidden = true;
      $('#step-otp').hidden = false;
      toast('OTP sent!');
    } catch (e) {
      toast(e.message);
    } finally {
      btn.textContent = 'Send OTP';
      btn.disabled = false;
    }
  };

  // --- Step 2: Verify OTP & Show Dashboard ---
  $('#btn-verify-otp').onclick = async () => {
    const code = $('#otp').value.trim();
    if (!code) return toast('OTP daalein');

    const btn = $('#btn-verify-otp');
    btn.textContent = 'Verifying...';
    btn.disabled = true;

    try {
      const res = await fetch('/api/auth/login-verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: currentEmail, code })
      });
      const data = await res.json();
      
      if (data.err) throw new Error(data.err);
      
      // Login successful, show dashboard
      $('#step-otp').hidden = true;
      $('#step-dashboard').hidden = false;
      $('#base-url').textContent = location.origin + '/api/ms-api/{token}/...';
      loadKeys();
    } catch (e) {
      toast(e.message);
    } finally {
      btn.textContent = 'Verify & Login';
      btn.disabled = false;
    }
  };

  // --- Load & Render Keys ---
  async function loadKeys() {
    const list = $('#keys-list');
    list.innerHTML = '<p style="text-align:center;opacity:0.6;padding:20px;">Loading keys...</p>';

    try {
      const secret = prompt("Enter AUTH_SECRET to view keys:");
      if (!secret) return list.innerHTML = '';

      const res = await fetch(`/api/ap/token/${currentEmail}/list`, {
        headers: { 'x-auth-secret': secret }
      });
      const data = await res.json();
      
      if (data.err) throw new Error(data.err);
      
      if (!data.keys.length) {
        list.innerHTML = '<p style="text-align:center;opacity:0.6;padding:20px;">No keys generated yet.</p>';
        return;
      }

      list.innerHTML = data.keys.map(k => `
        <div class="badge dev-card" style="margin-top: 8px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <b>API Key</b>
            <button class="copy-btn" onclick="copyToClipboard('${k}')">
              <svg class="i" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
              Copy
            </button>
          </div>
          <span class="key-val">${k}</span>
          <button class="btn" style="background:#ff3b30; margin-top:8px;" onclick="deleteKey('${k}')">Delete Key</button>
        </div>
      `).join('');

      // Select first key for docs
      if (data.keys.length) {
        currentKey = data.keys[0];
        renderCode('node');
      }
    } catch (e) {
      list.innerHTML = `<p style="color:#ff6b6b; text-align:center; padding:20px;">${e.message}</p>`;
    }
  }

  // --- Generate New Key ---
  $('#btn-gen').onclick = async () => {
    try {
      const res = await fetch(`/api/ap/token/${currentEmail}/true`, {
        method: 'GET',
        headers: { 'x-auth-secret': prompt("Enter AUTH_SECRET to generate:") }
      });
      const data = await res.json();
      if (data.err) throw new Error(data.err);
      
      toast('New Key Generated!');
      loadKeys();
    } catch (e) {
      toast(e.message);
    }
  };

  // --- Delete Key ---
  window.deleteKey = async (key) => {
    if (!confirm('Are you sure you want to delete this key?')) return;
    try {
      const res = await fetch(`/api/ap/token/${currentEmail}/delete?token=${key}`, {
        method: 'GET',
        headers: { 'x-auth-secret': prompt("Enter AUTH_SECRET to delete:") }
      });
      const data = await res.json();
      if (data.err) throw new Error(data.err);
      
      toast('Key Deleted');
      loadKeys();
    } catch (e) {
      toast(e.message);
    }
  };

  // --- Code Renderer ---
  const codes = {
    node: (url) => `const axios = require('axios');\n\nconst API_TOKEN = '${currentKey}';\nconst BASE_URL = '${location.origin}/api/ms-api/' + API_TOKEN;\n\nasync function getChats() {\n  const res = await axios.get(BASE_URL + '/chats');\n  console.log(res.data);\n}\n\ngetChats();`,
    
    js: (url) => `const API_TOKEN = '${currentKey}';\nconst BASE_URL = '${location.origin}/api/ms-api/' + API_TOKEN;\n\nasync function getChats() {\n  const res = await fetch(BASE_URL + '/chats');\n  const data = await res.json();\n  console.log(data);\n}\n\ngetChats();`,
    
    python: (url) => `import requests\n\nAPI_TOKEN = '${currentKey}'\nBASE_URL = '${location.origin}/api/ms-api/' + API_TOKEN\n\ndef get_chats():\n    res = requests.get(BASE_URL + '/chats')\n    print(res.json())\n\nget_chats()`,
    
    php: (url) => `<?php\n$API_TOKEN = '${currentKey}';\n$BASE_URL = '${location.origin}/api/ms-api/' . $API_TOKEN;\n\n$ch = curl_init($BASE_URL . '/chats');\ncurl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n$response = curl_exec($ch);\ncurl_close($ch);\n\necho $response;\n?>`,
    
    curl: (url) => `curl -X GET \\\n  "${location.origin}/api/ms-api/${currentKey}/chats"`
  };

  function renderCode(lang) {
    const box = $('#code-display');
    box.innerHTML = `<pre><code>${escapeHTML(codes[lang]())}</code></pre>`;
  }

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  // Tabs logic
  document.querySelectorAll('#code-tabs button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#code-tabs button').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      renderCode(btn.dataset.lang);
    };
  });

</script>
</body>
</html>
