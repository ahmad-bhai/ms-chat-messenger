<!DOCTYPE html>
<html lang="en" data-t="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MS Chat - Official Client</title>
<style>
:root{--bg:#14101c;--bb:rgba(38,32,52,.82);--bd:rgba(255,255,255,.14);--tx:#fff;--sf:#D0BDF4;--ac:linear-gradient(135deg,#E120E4,#C54FDA 50%,#9B0BE1);--me:#7a2bc4;--fs:16px;--an:1;--t:calc(.4s*var(--an));--sp:cubic-bezier(.34,1.56,.64,1);--gl:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.03))}
[data-t=light]{--bg:#f3ecfb;--bb:rgba(255,255,255,.9);--bd:rgba(0,0,0,.1);--tx:#1d1530;--sf:#6a4fa0;--me:#e3c9fb;--gl:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.4))}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font:15px Poppins,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--tx);height:100dvh;overflow:hidden}
[hidden]{display:none!important}
.i{width:22px;height:22px;fill:currentColor;flex:none}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);z-index:5}
#cv{z-index:6}#pg{z-index:7}
#dr,#sh{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.5)}#sh{z-index:9}#dlg{position:relative;z-index:10}
#ts{position:fixed;left:0;right:0;bottom:90px;z-index:11;display:flex;justify-content:center;pointer-events:none}
.tt{background:#000d;color:#fff;border-radius:99px;padding:10px 18px}
.badge{background:var(--bb);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:22px}
.hd{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:56px}
.fx{flex:1;min-width:0}.ttl{font-size:18px}
.ib,.tile{width:38px;height:38px;border-radius:12px;border:0;color:inherit;background:none;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.tile{background:var(--ac);color:#fff}
.av{border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none}
.row{display:flex;gap:12px;align-items:center;padding:8px 14px;cursor:pointer}.row:active{background:var(--bd)}
.r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.sn{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}b.sn{opacity:1}
small{opacity:.65;font-size:12px}
.bd{background:var(--ac);color:#fff;border-radius:99px;font-style:normal;font-size:12px;padding:1px 8px}
.inp{width:100%;background:var(--bb);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;color:inherit;font:inherit;outline:0;margin:5px 0}
.btn{width:100%;border:0;border-radius:99px;padding:14px;color:#fff;background:var(--ac);font-weight:700;font-size:16px;font-family:inherit;cursor:pointer;margin-top:8px}
#ms{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:6px 0}
.m{max-width:84%;padding:6px 10px;border-radius:16px;margin:2px 10px;font-size:var(--fs);word-break:break-word;border:1px solid var(--bd)}
.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}.th{align-self:flex-start;background:var(--bb);border-bottom-left-radius:4px}
.mt{display:flex;gap:4px;justify-content:flex-end;align-items:center;margin-top:2px}
.cmp{display:flex;gap:6px;align-items:flex-end;padding:8px}
.cmp textarea{flex:1;max-height:120px;resize:none;border-radius:20px;padding:10px 14px;background:var(--bb);border:1px solid var(--bd);color:inherit;font:inherit;outline:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.bx{width:100%;max-width:360px;padding:18px;background:var(--bg)}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;padding:8px;background:var(--bg);border-radius:20px}
.it{display:flex;gap:14px;align-items:center;padding:12px;cursor:pointer}.it.red{color:#ff6b6b}
hr{border:0;border-top:1px solid var(--bd);margin:6px 0}
.sec{margin:10px 0;padding:4px}
</style>
</head>
<body>

<div id="app"></div>
<div id="cv" class="scr" hidden></div>
<div id="pg" class="scr" hidden></div>
<div id="dr" hidden></div>
<div id="sh" hidden></div>
<div id="dlg"></div>
<div id="ts"></div>
<input type="file" id="fl" hidden>

<script>
  // Apni API key yahan dalein
  const API_KEY = 'ms_dev_9f8fcf0e2e34cc97c959637af4b1cf85';
  const BASE_URL = 'https://ms-chat-messenger.vercel.app/api/ms-api/' + API_KEY;

  const $ = s => document.querySelector(s), E = encodeURIComponent;
  const D = (k,d)=>{try{return JSON.parse(localStorage[k])||d}catch(e){return d}};
  const S = {
    ch: [], ms: [], cur: null, me: null,
    sel: new Set(),
    recSearches: D('ms_rec_s', []),
    st: D('ms_s', {fs:16, t:'dark'})
  };
  const sv = () => {
    localStorage.ms_rec_s = JSON.stringify(S.recSearches);
    localStorage.ms_s = JSON.stringify(S.st);
  };

  const I = {
    menu: 'M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z',
    search: 'M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z',
    back: 'M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z',
    more: 'M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z',
    close: 'M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
    ok: 'M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z',
    del: 'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z',
    pin: 'M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3 z',
    mute: 'M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z',
    send: 'M2.01 21L23 12 2.01 3 2 10l15 2-15 2z',
    block: 'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM4 12c0-4.42 3.58-8 8-8 1.85 0 3.55.63 4.9 1.69L5.69 16.9A7.9 7.9 0 014 12zm8 8c-1.85 0-3.55-.63-4.9-1.69L18.31 7.1A7.9 7.9 0 0120 12c0 4.42-3.58 8-8 8z'
  };

  const ic = n => `<svg class="i" viewBox="0 0 24 24"><path d="${I[n]||''}"/></svg>`;
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const tm = t => new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const ct = c => c.saved ? 'Saved Messages' : c.cn || c.peer.name;
  const av = (u,z=46) => u&&u.avatar?`<img class="av" style="width:${z}px;height:${z}px" src="${esc(u.avatar)}">`:`<span class="av" style="width:${z}px;height:${z}px;background:#7a2bc4">${esc((u&&u.name?u.name:'?').charAt(0))}</span>`;
  
  let tt;
  const toast = t => { $('#ts').innerHTML = `<div class="tt">${t}</div>`; clearTimeout(tt); tt = setTimeout(()=>$('#ts').innerHTML='',2600); };
  
  async function api(p,b){
    const token = localStorage.getItem('ms_dev_token');
    const r = await fetch(BASE_URL+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:b?JSON.stringify(b):undefined});
    if(r.status===401){ localStorage.removeItem('ms_dev_token'); location.reload(); }
    return r.json().catch(()=>({}));
  }

  const sheet = h => { $('#sh').innerHTML=`<div class="sheet badge">${h}</div>`; $('#sh').hidden=false; };
  const closeSh = () => { $('#sh').hidden=true; };
  document.addEventListener('click',e=>{ if(e.target.id==='sh')closeSh(); });

  function dlg(o){
    return new Promise(res=>{
      const d=$('#dlg');
      d.innerHTML=`<div class="ov"><div class="badge bx"><h3>${o.t}</h3>${o.cb?`<label><input type="checkbox" id="dc"> ${o.cb}</label>`:''}<div class="bt" style="display:flex;gap:10px;margin-top:12px;justify-content:flex-end"><button id="dn" style="background:none;border:0;color:#C54FDA;font-weight:700;cursor:pointer">Cancel</button><button id="ok" style="background:none;border:0;color:${o.red?'#ff5b5b':'#C54FDA'};font-weight:700;cursor:pointer">${o.ok||'OK'}</button></div></div></div>`;
      $('#dn').onclick=()=>{d.innerHTML='';res({ok:false});};
      $('#ok').onclick=()=>{const cb=!!($('#dc')&&$('#dc').checked);d.innerHTML='';res({ok:true,cb});};
    });
  }

  function formatDateHeader(ts) {
    const d = new Date(ts), now = new Date();
    const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const startYest = new Date(startToday); startYest.setDate(startYest.getDate()-1);
    if(d>=startToday) return 'Today';
    if(d>=startYest) return 'Yesterday';
    return d.toLocaleDateString('en-US',{month:'long',day:'numeric'});
  }

  // --- Boot ---
  async function boot(){
    document.documentElement.dataset.t = S.st.t;
    const j = await api('/me');
    if(!j.me) { renderLogin(); return; }
    S.me = j.me;
    loadChats();
  }

  function renderLogin(){
    $('#app').innerHTML = `<div class="scr" style="justify-content:center;align-items:center;padding:20px"><div style="max-width:360px;width:100%;text-align:center"><h1>MS Chat API</h1><input id="em" class="inp" placeholder="Email" type="email"><button class="btn" id="lg">Continue</button></div></div>`;
    $('#lg').onclick = async () => {
      const email = $('#em').value.trim();
      if(!email) return toast('Enter email');
      const res = await api('/login-start', {email});
      if(res.err) return toast(res.err);
      toast('Code sent!');
      renderOTP(email);
    };
  }

  function renderOTP(email){
    $('#app').innerHTML = `<div class="scr" style="justify-content:center;align-items:center;padding:20px"><div style="max-width:360px;width:100%;text-align:center"><h1>Enter Code</h1><input id="cd" class="inp" placeholder="123456" maxlength="6"><button class="btn" id="vf">Verify</button></div></div>`;
    $('#vf').onclick = async () => {
      const code = $('#cd').value.trim();
      const res = await api('/login-verify', {email, code});
      if(res.err) return toast(res.err);
      if(res.token){ localStorage.setItem('ms_dev_token', res.token); boot(); }
    };
  }

  async function loadChats(){
    const j = await api('/chats');
    S.ch = j.chats || [];
    list();
  }

  // --- Chat List & Multi-Select ---
  function list(){
    $('#app').innerHTML = `
      <div class="scr" id="lst">
        <div class="hd">
          <b class="ttl fx">MS Chat</b>
          <button class="ib" data-a="gs">${ic('search')}</button>
        </div>
        <div id="sb" hidden style="padding:0 12px">
          <input id="q" class="inp" placeholder="Search chats..." oninput="lsearch(this.value)">
        </div>
        <div id="cl" style="overflow:auto;flex:1"></div>
      </div>
    `;
    cl2();
    document.querySelector('[data-a="gs"]').onclick = toggleSearch;
  }

  function toggleSearch(){
    const s = $('#sb');
    s.hidden = !s.hidden;
    if(s.hidden) cl2(); else renderSearchDefaultView();
  }

  function renderSearchDefaultView(){
    const topUsers = S.ch.slice(0, 21);
    const topHtml = topUsers.length ? `
      <div style="padding:10px 0;border-bottom:1px solid var(--bd);">
        <small style="padding:0 14px;opacity:0.7;font-weight:600;">FREQUENT CHATS</small>
        <div style="display:flex;gap:12px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;">
          ${topUsers.map(c=>`
            <div onclick="openCByChat('${c.chat}')" style="display:flex;flex-direction:column;align-items:center;min-width:62px;cursor:pointer;">
              ${av(c.peer, 52)}
              <small class="sn" style="width:62px;font-size:11px;margin-top:4px;text-align:center;">${esc(ct(c))}</small>
            </div>
          `).join('')}
        </div>
      </div>
    ` : '';

    const recHtml = `
      <div style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center;">
        <small style="opacity:0.7;font-weight:600;">RECENT SEARCHES</small>
        ${S.recSearches.length ? `<span onclick="clearRec()" style="color:#ff5b5b;font-size:12px;cursor:pointer;font-weight:600;">Clear All</span>` : ''}
      </div>
      <div>
        ${S.recSearches.length ? S.recSearches.map((u,i)=>`
          <div class="row" onclick="openUser('${u.username}')">
            ${av(u, 44)}
            <div class="fx"><b>${esc(u.name)}</b><br><small>@${esc(u.username)}</small></div>
            <button class="ib" onclick="event.stopPropagation();delRec(${i})" style="width:30px;height:30px;">${ic('close')}</button>
          </div>
        `).join('') : '<p style="text-align:center;padding:20px;opacity:0.5;">No recent searches</p>'}
      </div>
    `;
    $('#cl').innerHTML = topHtml + recHtml;
  }

  window.clearRec = () => { S.recSearches = []; sv(); renderSearchDefaultView(); };
  window.delRec = i => { S.recSearches.splice(i,1); sv(); renderSearchDefaultView(); };

  async function lsearch(v){
    if(!v.trim()) return renderSearchDefaultView();
    const j = await api('/search?q='+E(v));
    $('#cl').innerHTML = (j.users||[]).map(u=>`
      <div class="row" onclick="selectUserSearch(${JSON.stringify(u).replace(/"/g, '&quot;')})">
        ${av(u)}
        <div class="fx"><b>${esc(u.name)}</b><br><small>@${esc(u.username)}</small></div>
      </div>
    `).join('') || '<p style="text-align:center;padding:24px;opacity:.6">No results</p>';
  }

  window.selectUserSearch = u => {
    S.recSearches = [u, ...S.recSearches.filter(x=>x.id!==u.id)].slice(0,15);
    sv();
    openUser(u.username);
  };

  async function openUser(username){
    const j = await api('/user?u='+E(username));
    if(j.user) openC({chat:j.chat, peer:j.user, cn:j.cn, saved:j.self, blocked:j.blocked});
  }

  window.openCByChat = chatId => {
    const c = S.ch.find(x=>x.chat===chatId);
    if(c) openC(c);
  };

  function cl2(){
    $('#cl').innerHTML = S.ch.map(c=>{
      const isSel = S.sel.has(c.chat);
      return `
        <div class="row" style="${isSel?'background:var(--bd);':''}" onclick="onRowClick('${c.chat}')" oncontextmenu="event.preventDefault();toggleSel('${c.chat}')">
          ${isSel ? `<span class="tile" style="width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff">${ic('ok')}</span>` : av(c.peer, 50)}
          <div class="fx">
            <div class="r1"><b>${esc(ct(c))}</b><small>${c.last?tm(c.last.ts):''}</small></div>
            <div class="r1"><span class="sn">${esc(c.last?c.last.text:'No messages')}</span>${c.unread?`<i class="bd">${c.unread}</i>`:''}</div>
          </div>
        </div>
      `;
    }).join('') || '<p style="text-align:center;padding:30px;opacity:0.5">No chats yet</p>';
  }

  window.toggleSel = chatId => {
    if(S.sel.has(chatId)) S.sel.delete(chatId); else S.sel.add(chatId);
    if(S.sel.size > 0) renderSelHeader(); else restoreHeader();
    cl2();
  };

  window.onRowClick = chatId => {
    if(S.sel.size > 0){ toggleSel(chatId); }
    else { openCByChat(chatId); }
  };

  function renderSelHeader(){
    $('#lst').querySelector('.hd').innerHTML = `
      <button class="ib" onclick="restoreHeader()">${ic('close')}</button>
      <b class="ttl fx">${S.sel.size} Selected</b>
      <button class="ib" onclick="batchPin()">${ic('pin')}</button>
      <button class="ib" onclick="batchMute()">${ic('mute')}</button>
      <button class="ib" onclick="batchDel()">${ic('del')}</button>
      <button class="ib" onclick="sheet('${it('ok','Select All','all')}${it('block','Block Users','blk',1)}')">${ic('more')}</button>
    `;
  }

  window.restoreHeader = () => {
    S.sel.clear();
    $('#lst').querySelector('.hd').innerHTML = `<b class="ttl fx">MS Chat</b><button class="ib" onclick="toggleSearch()">${ic('search')}</button>`;
    cl2();
  };

  window.batchPin = async () => { for(let id of S.sel) await api('/chat/pin',{chat:id}); toast('Updated'); restoreHeader(); loadChats(); };
  window.batchMute = async () => { for(let id of S.sel) await api('/chat/mute',{chat:id,until:-1}); toast('Muted'); restoreHeader(); loadChats(); };
  window.batchDel = async () => {
    const r = await dlg({t:`Delete ${S.sel.size} chats?`,cb:'Also delete for recipient',ok:'Delete',red:1});
    if(r.ok){ for(let id of S.sel) await api('/chat/delete',{chat:id,both:r.cb}); toast('Deleted'); restoreHeader(); loadChats(); }
  };

  // --- Chat View & Messages with Date Separators ---
  async function openC(c){
    S.cur = c;
    $('#cv').hidden = false;
    $('#cv').innerHTML = `
      <div class="hd badge" style="border-radius:0">
        <button class="ib" onclick="$('#cv').hidden=true">${ic('back')}</button>
        ${av(c.peer, 36)}
        <b class="ttl fx">${esc(ct(c))}</b>
      </div>
      <div id="ms"></div>
      <div class="cmp">
        <textarea id="inp" rows="1" placeholder="Type message..."></textarea>
        <button class="tile" onclick="snd()">${ic('send')}</button>
      </div>
    `;
    await fetchMsgs();
  }

  async function fetchMsgs(){
    const res = await api('/msgs?chat='+E(S.cur.chat));
    S.ms = res.msgs || [];
    drawMsgs();
  }

  function drawMsgs(){
    const el = $('#ms');
    if(!el) return;
    let html = '', lastDate = '';
    S.ms.forEach(m => {
      const dStr = formatDateHeader(m.ts);
      if(dStr !== lastDate){
        html += `<div style="text-align:center;margin:12px 0;"><span class="badge" style="padding:4px 14px;font-size:12px;">${dStr}</span></div>`;
        lastDate = dStr;
      }
      const me = m.from === S.me.id;
      html += `<div class="m ${me?'me':'th'}"><div>${esc(m.text||'')}</div><div class="mt"><small>${tm(m.ts)}</small></div></div>`;
    });
    el.innerHTML = html || '<p style="text-align:center;opacity:0.5;margin-top:20px">No messages</p>';
    el.scrollTop = el.scrollHeight;
  }

  window.snd = async () => {
    const txt = $('#inp').value.trim();
    if(!txt) return;
    $('#inp').value = '';
    await api('/send', {chat: S.cur.chat, text: txt});
    fetchMsgs();
  };

  boot();
</script>
</body>
</html>
